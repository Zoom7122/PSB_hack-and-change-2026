services:
  answer-generation:
    build: .
    env_file:
      - .env
    ports:
      - "${PORT:-8005}:${PORT:-8005}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; urllib.request.urlopen(f'http://127.0.0.1:{os.getenv(\"PORT\",\"8005\")}/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
